<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Huey Coyote | Música, Sudor y Cumbia</title>
<meta name="description" content="El Huey Coyote — Música, Sudor y Cumbia.">
<!--
  Reparte según el aparato: teléfono -> /movil/ , computadora -> /compu/
  Se puede forzar una versión con ?v=movil o ?v=compu (útil para revisar).
  El redirect va en el <head> y usa location.replace para no ensuciar el historial
  (así el botón "atrás" no rebota entre esta página y la versión elegida).
-->
<script>
(function () {
  var forzado = null;
  try { forzado = new URLSearchParams(location.search).get('v'); } catch (e) {}
  var esMovil;
  if (forzado === 'movil' || forzado === 'compu') {
    esMovil = (forzado === 'movil');
  } else if (window.matchMedia) {
    /* 900px deja las tablets en horizontal con la versión compu. */
    esMovil = window.matchMedia('(max-width: 900px)').matches;
  } else {
    /* Respaldo para navegadores viejos sin matchMedia. */
    esMovil = (document.documentElement.clientWidth || window.innerWidth || 1200) <= 900;
  }
  location.replace(esMovil ? 'movil/' : 'compu/');
})();
</script>
<style>
  html,body{height:100%;margin:0}
  body{background:#111;color:#f4f1e8;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#e8c33a;font-weight:700;text-decoration:none;border-bottom:2px solid #c4161c;padding-bottom:2px}
  p{margin:0 0 18px;font-size:18px;line-height:1.5}
</style>
</head>
<body>
  <!-- Sólo se ve si el navegador trae JavaScript apagado. -->
  <noscript>
    <div>
      <p>El Huey Coyote — Música, Sudor y Cumbia</p>
      <p>Entra a la versión para <a href="compu/">computadora</a> o para <a href="movil/">teléfono</a>.</p>
    </div>
  </noscript>
</body>
</html>
